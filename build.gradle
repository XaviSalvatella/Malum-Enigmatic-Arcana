plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            mods { enigmatic_arcana { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}
repositories {
    maven { url = 'https://cursemaven.com' }
    maven { url = 'https://maven.theillusivec4.top' }
    maven { url = 'https://maven.kosmx.dev' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf('curse.maven:malum-484064:6646111')
    implementation fg.deobf('curse.maven:irons-spells-n-spellbooks-855414:6054196')
    implementation fg.deobf('team.lodestar.lodestone:lodestone:1.20.1-1.6.4.1.256')
    implementation fg.deobf('top.theillusivec4.curios:curios-forge:5.11.0+1.20.1')
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.7.1.1')
    implementation fg.deobf('dev.kosmx.player-anim:player-animation-lib-forge:1.0.2-rc1+1.20')
    implementation fg.deobf('top.theillusivec4.caelus:caelus-forge:3.1.0+1.20')
    // HazentouveLib calls still require a 1.20.1 replacement; see PORT_STATUS.md.
}
sourceSets.main.resources.srcDir 'src/generated/resources'
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar.finalizedBy('reobfJar')
