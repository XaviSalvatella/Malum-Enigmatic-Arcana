name: Forge 1.20.1 port check
on:
  push:
    branches: ['port/forge-1.20.1']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile unfinished port
        run: bash gradlew compileJava --no-daemon --stacktrace
