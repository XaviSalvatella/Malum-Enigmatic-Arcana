name: Comprobar port Forge 1.20.1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/forge-port.yml']
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port/forge-1.20.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew compileJava --no-daemon --stacktrace
